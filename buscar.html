<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscar itens | PASSO ÚNICO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/buscar.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/hero-carrossel.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- ===================================================== -->
<!-- HEADER -->
<!-- ===================================================== -->

<div id="header-dinamico"></div>

<!-- ===================================================== -->
<!-- HERO -->
<!-- ===================================================== -->

<section class="buscar-hero">

    <div class="hero-content">

        <div class="hero-badge">
            Inclusão • Mobilidade • Solidariedade
        </div>

        <h1>
            Encontre calçados,<br>
            muletas e cadeiras de rodas
        </h1>

        <p>
            Busque itens cadastrados na plataforma
            e conecte-se rapidamente com quem está doando ou vendendo.
        </p>

    </div>

</section>

<!-- ===================================================== -->
<!-- BUSCA -->
<!-- ===================================================== -->

<section class="buscar-section">

    <div class="container">

        <div class="filtros-box">

            <form id="formBusca" class="filtros-grid">

                <div class="filtro-group">

                    <label>Categoria</label>

                    <select id="categoria">

                        <option value="">
                            Todas
                        </option>

                    </select>

                </div>

                <div class="filtro-group">

                    <label>Cidade</label>

                    <input
                        type="text"
                        id="cidade"
                        placeholder="Digite sua cidade"
                    >

                </div>

                <div class="filtro-group" id="grupoNumero">

                    <label>Número</label>

                    <input
                        type="number"
                        id="numero"
                        placeholder="Ex: 38"
                    >

                </div>

                <div class="filtro-group">

                    <label>Tipo</label>

                    <select id="tipo">

                        <option value="">
                            Todos
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn-primary buscar-btn"
                >
                    Buscar
                </button>

            </form>

        </div>

        <div class="resultados-topo">

            <h2>
                Itens disponíveis
            </h2>

            <p id="contadorResultados">
                Carregando resultados...
            </p>

        </div>

        <div
            id="lista-calcados"
            class="calcados-grid"
        ></div>

    </div>

</section>

<!-- ===================================================== -->
<!-- FOOTER -->
<!-- ===================================================== -->

<!-- FOOTER -->
<div id="footer-dinamico"></div>
<script>window.paginaAtual = "buscar";</script>
<script src="js/header.js"></script>
<script src="js/footer.js"></script>

<script src="js/supabase.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal.js"></script>
<script src="js/buscar.js"></script>
<script src="js/hero-carrossel.js"></script>

</body>
</html>
