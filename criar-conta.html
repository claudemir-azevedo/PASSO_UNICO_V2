<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Criar Conta | PASSO ÚNICO
</title>

<link
rel="stylesheet"
href="css/global.css">

<link
rel="stylesheet"
href="css/components.css">

<link
rel="stylesheet"
href="css/header.css">

<link
rel="stylesheet"
href="css/toast.css">

rel="stylesheet"
href="css/criar-conta.css">

</head>

<body>

<!-- HEADER -->

<div id="header-dinamico"></div>

<!-- CONTAINER -->

<div class="container">

<div class="card">

<div class="titulo-card">

<h2>

Criar Conta

</h2>

<p>

Cadastre novos usuários no sistema.

</p>

</div>

<div class="form-grid">

<input
id="nome"
placeholder="Nome completo">

<input
id="email"
type="email"
placeholder="Email">

<input
id="telefone"
placeholder="Telefone">

<input
id="cidade"
placeholder="Cidade">

<input
id="estado"
placeholder="Estado">

<input
id="senha"
type="password"
placeholder="Senha">

<select id="tipo_usuario" disabled aria-label="Tipo de usuário">

<option value="colaborador">

Colaborador

</option>

</select>

</div>

<div class="botoes">

<button id="btnCriar">

Criar Conta

</button>

</div>

<div
id="mensagem"
class="status">

</div>

</div>

</div>

<!-- VARIÁVEL GLOBAL -->

<script>

let paginaAtual = 'cadastro';

</script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CORE -->

<script src="js/supabase.js"></script>

<!-- COMPONENTES -->

<script src="js/header.js"></script>

<script src="js/toast.js"></script>

<script src="js/loader.js"></script>

<script src="js/criar-conta.js"></script>
