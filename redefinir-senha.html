<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Redefinir Senha | PASSO ÚNICO
</title>

<link
rel="stylesheet"
href="css/global.css">

<link
rel="stylesheet"
href="css/components.css">

<link
rel="stylesheet"
href="css/header.css">

<link
rel="stylesheet"
href="css/toast.css">

<link
rel="stylesheet"
href="css/redefinir-senha.css">

</head>

<body>

<!-- HEADER -->

<div id="header-dinamico"></div>

<!-- WRAPPER -->

<div class="wrapper">

<!-- LEFT -->

<div class="left">

<div class="tag">

Segurança • Recuperação • Acesso

</div>

<h1>

Crie uma nova senha com segurança.

</h1>

<p>

Atualize sua senha para continuar acessando
a plataforma PASSO ÚNICO de forma segura
e protegida.

</p>

</div>

<!-- RIGHT -->

<div class="right">

<div class="card">

<h2>

Nova senha

</h2>

<p>

Digite sua nova senha abaixo.

</p>

<form id="formSenha" novalidate>

<div class="form-group" id="grupoEmailRecuperacao">

<label for="emailRecuperacao">E-mail</label>

<input type="email" id="emailRecuperacao" autocomplete="email" placeholder="Digite seu e-mail">

</div>

<div class="form-group">

<label>

Nova senha

</label>

<input
type="password"
id="novaSenha"
required>

</div>

<div class="form-group">

<label>

Confirmar senha

</label>

<input
type="password"
id="confirmarSenha"
required>

</div>

<button
type="submit"
class="btn">

Salvar nova senha

</button>

</form>

<div id="statusSenha" class="status-box" role="status" aria-live="polite"></div>

<div class="links">

<a href="login.html">

Voltar para login

</a>

</div>

</div>

</div>

</div>

<!-- VARIÁVEL GLOBAL -->

<script>

let paginaAtual = 'redefinir-senha';

</script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CORE -->

<script src="js/supabase.js"></script>

<!-- COMPONENTES -->

<script src="js/header.js"></script>

<script src="js/toast.js"></script>

<script src="js/modal.js"></script>

<script src="js/loader.js"></script>

<!-- PÁGINA -->

<script src="js/redefinir-senha.js"></script>

</body>

</html>
