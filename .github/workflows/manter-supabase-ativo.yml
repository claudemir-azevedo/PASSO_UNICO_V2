name: Manter Supabase ativo

# Faz uma consulta leve ao banco a cada 3 dias para o plano gratuito
# do Supabase não pausar o projeto por inatividade.

on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC (06:17 em Brasília), a cada 3 dias
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Consultar o banco do Supabase
        env:
          SUPABASE_URL: https://cfwqfsenyjzsuckydppb.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # remove espaços e quebras de linha que podem vir junto ao colar a chave
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          if [ -z "$KEY" ]; then
            echo "O secret SUPABASE_ANON_KEY está vazio ou não foi encontrado."
            exit 1
          fi

          status=$(curl -s -o resposta.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/calcados?select=id&limit=1" \
            -H "apikey: $KEY")

          echo "Resposta do Supabase: HTTP $status"
          echo "Corpo da resposta:"
          cat resposta.txt
          echo

          if [ "$status" != "200" ]; then
            echo "O Supabase não respondeu como esperado."
            exit 1
          fi
