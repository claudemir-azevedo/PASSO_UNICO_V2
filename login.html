<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
PASSO ÚNICO • Entrar
</title>

<link
rel="stylesheet"
href="css/global.css">

<link
rel="stylesheet"
href="css/components.css">

<link
rel="stylesheet"
href="css/header.css">

<link
rel="stylesheet"
href="css/footer.css">

<link
rel="stylesheet"
href="css/toast.css">

<link
rel="stylesheet"
href="css/modal.css">

<link
rel="stylesheet"
href="css/login.css">

</head>

<body>

<!-- HEADER -->

<div id="header-dinamico"></div>

<!-- LOGIN -->

<main class="login-page">

    <!-- LEFT -->

    <section class="login-left">

        <div class="login-content">

            <div class="badge">

                Impacto social • Plataforma colaborativa

            </div>

            <h1>

                Cada passo reaproveitado pode transformar uma vida.

            </h1>

            <p>

                Acesse sua conta para acompanhar
                doações, conexões e novas oportunidades
                através do reaproveitamento inteligente.

            </p>

        </div>

    </section>

    <!-- RIGHT -->

    <section class="login-right">

        <div class="login-visual">

            <img
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1400&auto=format&fit=crop"
            alt="Tênis">

        </div>

        <div class="login-card">

<img
src="assets/img/logo.png"
alt="Passo Único"
class="login-logo">

            <h2>

                Entrar

            </h2>

            <form id="form-login">

                <!-- EMAIL -->

                <div class="input-group">

                    <label>

                        E-mail

                    </label>

                    <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required>

                </div>

                <!-- SENHA -->

                <div class="input-group">

                    <label>

                        Senha

                    </label>

                    <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required>

                </div>

                <!-- BOTÃO -->

<button
type="submit"
class="btn-login-form">

                    Entrar

                </button>

            </form>

            <!-- RECUPERAR -->

            <a
            href="redefinir-senha.html"
            class="link-recuperar">

                Esqueci minha senha

            </a>

        </div>

    </section>

</main>

<!-- FOOTER -->

<div id="footer-dinamico"></div>

<!-- VARIÁVEL GLOBAL -->

<script>

let paginaAtual = 'login';

</script>

<!-- SUPABASE -->

<script src="js/footer.js"></script>

<script src="js/loader.js"></script>

<!-- PÁGINA -->

<script src="js/login.js"></script>

</body>

</html>
